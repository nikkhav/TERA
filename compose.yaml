name: tera

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://tera:${POSTGRES_PASSWORD:-tera-local}@postgres:5432/tera
    S3_ENDPOINT_URL: http://s3:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tera-local}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-tera-local-secret}
    S3_BUCKET: ${S3_BUCKET:-tera-documents}
    S3_REGION: ${S3_REGION:-us-east-1}
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    OLLAMA_THINK: ${OLLAMA_THINK:-}
    MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-8192}
    MODEL_OUTPUT_TOKENS: ${MODEL_OUTPUT_TOKENS:-1536}
    MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
    JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-1200}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tera
      POSTGRES_USER: tera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tera-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tera -d tera"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-tera-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-tera-local-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy

  init:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m tera.init_storage"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "tera.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  ollama-data:
