[project]
name = "tera"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.26.5",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 100
