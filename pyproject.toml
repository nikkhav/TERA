[project]
name = "tera"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "ipykernel>=6.31.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.26.5",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
